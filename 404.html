<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, follow" />
<title>Página no encontrada — TokenSaver</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
<meta name="theme-color" content="#0a0d12" />
<style>
  :root { --canvas:#0a0d12; --card:#141820; --hair:#232a34; --ink:#fff; --ash:#a1a1a8; --coral:#ff6363; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
    background: var(--canvas); color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background-image: radial-gradient(55% 40% at 70% 0%, rgba(255,99,99,.07), transparent 70%);
  }
  .box { max-width: 520px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 28px; }
  .brand img { width: 26px; height: 26px; border-radius: 7px; }
  .brand span { font-weight: 600; letter-spacing: -.025em; font-size: 16.5px; }
  .brand span b { color: var(--ash); font-weight: 600; }
  h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; letter-spacing: -.03em; margin: 0 0 14px; }
  h1 em { font-style: normal; color: #6a6b6c; }
  p { color: var(--ash); font-size: 15px; line-height: 1.7; margin: 0 0 26px; }
  .cta { display: inline-block; background: var(--ink); color: #0b0d10; text-decoration: none;
         font-weight: 600; font-size: 14px; padding: 12px 20px; border-radius: 10px; }
  .links { margin-top: 26px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
  .links a { color: #9c9c9d; text-decoration: none; border-bottom: 1px solid #2f3031; padding-bottom: 2px; }
  .links a:hover { color: #fff; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <img src="/assets/icon.svg" alt="" />
      <span>Token<b>Saver</b></span>
    </div>
    <h1>Esta página se fue<br /><em>a otro sitio.</em></h1>
    <p>El enlace que has seguido no existe (o existió y ya no). Lo que buscabas sigue en la portada: sube tus logs y en cinco segundos ves dónde se fue el dinero en tokens.</p>
    <a class="cta" href="/">Volver a TokenSaver</a>
    <div class="links">
      <a href="/guia.html">Guía de ahorro</a>
      <a href="/#precios">Precios</a>
      <a href="/#faq">Preguntas frecuentes</a>
    </div>
  </div>
</body>
</html>
